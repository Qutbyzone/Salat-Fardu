<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="aliSkin" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="70%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </radialGradient>
    <linearGradient id="aliShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="whitePeci" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="aliClay">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#064e3b" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Bubble -->
  <circle cx="100" cy="100" r="90" fill="#d1fae5" filter="url(#aliClay)"/>

  <!-- Body / Baju Koko Hijau -->
  <path d="M45 190 Q100 155 155 190 L160 200 L40 200 Z" fill="url(#aliShirt)" filter="url(#aliClay)"/>
  <rect x="92" y="165" width="16" height="30" rx="3" fill="#ffffff" opacity="0.9"/>
  <path d="M80 160 Q100 175 120 160" stroke="#fef08a" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="85" y="130" width="30" height="25" rx="10" fill="#fdba74"/>

  <!-- Head -->
  <circle cx="100" cy="98" r="50" fill="url(#aliSkin)" filter="url(#aliClay)"/>

  <!-- Ears -->
  <circle cx="48" cy="102" r="12" fill="#fdba74"/>
  <circle cx="152" cy="102" r="12" fill="#fdba74"/>

  <!-- Cheeks -->
  <circle cx="70" cy="115" r="9" fill="#f43f5e" opacity="0.32"/>
  <circle cx="130" cy="115" r="9" fill="#f43f5e" opacity="0.32"/>

  <!-- Eyes with lively twinkle -->
  <ellipse cx="78" cy="98" rx="8" ry="11" fill="#064e3b"/>
  <circle cx="80" cy="94" r="3.5" fill="#ffffff"/>
  <circle cx="75" cy="102" r="1.5" fill="#ffffff"/>

  <ellipse cx="122" cy="98" rx="8" ry="11" fill="#064e3b"/>
  <circle cx="124" cy="94" r="3.5" fill="#ffffff"/>
  <circle cx="119" cy="102" r="1.5" fill="#ffffff"/>

  <!-- Eyebrows -->
  <path d="M68 81 Q78 75 88 81" stroke="#064e3b" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M112 81 Q122 75 132 81" stroke="#064e3b" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Smile with visible tooth -->
  <path d="M88 116 Q100 131 112 116" stroke="#991b1b" stroke-width="3" fill="#e11d48" stroke-linecap="round"/>
  <rect x="95" y="116" width="10" height="5" rx="2" fill="#ffffff"/>

  <!-- White 3D Peci Haji / Kopiah -->
  <g filter="url(#aliClay)">
    <path d="M52 78 Q100 58 148 78 L146 48 Q100 32 54 48 Z" fill="url(#whitePeci)"/>
    <path d="M53 76 Q100 56 147 76" stroke="#10b981" stroke-width="3.5" fill="none"/>
  </g>
</svg>