<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="fSkinGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="70%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </radialGradient>
    <linearGradient id="hijabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="dressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="fClay">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#831843" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Bubble -->
  <circle cx="100" cy="100" r="90" fill="#fce7f3" filter="url(#fClay)"/>

  <!-- Body / Gamis Dress -->
  <path d="M40 190 Q100 155 160 190 L165 200 L35 200 Z" fill="url(#dressGrad)" filter="url(#fClay)"/>

  <!-- Hijab Drape over Shoulders -->
  <path d="M45 150 Q100 195 155 150 Q165 175 140 195 Q100 205 60 195 Z" fill="url(#hijabGrad)" filter="url(#fClay)"/>

  <!-- Outer Hijab Head -->
  <path d="M42 95 C42 45 158 45 158 95 C158 135 150 170 100 170 C50 170 42 135 42 95 Z" fill="url(#hijabGrad)" filter="url(#fClay)"/>

  <!-- Inner Face Opening -->
  <ellipse cx="100" cy="102" rx="40" ry="46" fill="url(#fSkinGrad)"/>

  <!-- Inner Hijab Framing (Ciput) -->
  <path d="M60 88 Q100 65 140 88 Q100 75 60 88 Z" fill="#ffffff" opacity="0.95"/>

  <!-- Rosy Cheeks -->
  <circle cx="72" cy="118" r="9" fill="#f43f5e" opacity="0.38"/>
  <circle cx="128" cy="118" r="9" fill="#f43f5e" opacity="0.38"/>

  <!-- Big Sparkling 3D Eyes -->
  <ellipse cx="78" cy="104" rx="8" ry="11" fill="#1e1b4b"/>
  <circle cx="80" cy="100" r="3.5" fill="#ffffff"/>
  <circle cx="75" cy="108" r="1.5" fill="#ffffff"/>
  <!-- Lashes -->
  <path d="M70 96 L65 92" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M78 92 L78 87" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round"/>

  <ellipse cx="122" cy="104" rx="8" ry="11" fill="#1e1b4b"/>
  <circle cx="124" cy="100" r="3.5" fill="#ffffff"/>
  <circle cx="119" cy="108" r="1.5" fill="#ffffff"/>
  <!-- Lashes -->
  <path d="M130 96 L135 92" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M122 92 L122 87" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Eyebrows -->
  <path d="M70 88 Q80 83 90 88" stroke="#374151" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M110 88 Q120 83 130 88" stroke="#374151" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Sweet Smile -->
  <path d="M88 122 Q100 136 112 122" stroke="#9f1239" stroke-width="3.5" fill="#f43f5e" stroke-linecap="round"/>
  <path d="M93 124 Q100 130 107 124" fill="#ffffff"/>

  <!-- Flower Brooch on Hijab -->
  <g transform="translate(138, 70) scale(0.7)" filter="url(#fClay)">
    <circle cx="0" cy="-10" r="8" fill="#fef08a"/>
    <circle cx="10" cy="0" r="8" fill="#fef08a"/>
    <circle cx="0" cy="10" r="8" fill="#fef08a"/>
    <circle cx="-10" cy="0" r="8" fill="#fef08a"/>
    <circle cx="0" cy="0" r="6" fill="#f59e0b"/>
  </g>
</svg>